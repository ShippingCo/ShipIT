<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShipIT · Frontend wireframes</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:white;font-size:14px;--blue:#2563eb;--line:#e4e7ec;--muted:#667085}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.review{padding:14px 24px;border-bottom:1px solid var(--line);background:#f8fafc;display:flex;gap:16px;justify-content:space-between;align-items:center}.review p{margin:4px 0;color:var(--muted);font-size:12px}.review a{color:var(--blue)}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 77px)}aside{background:#f3f4f6;border-right:1px solid var(--line);padding:24px 16px}.brand{font-size:18px;font-weight:750;margin:0 12px 30px}.outlet{padding:12px;background:white;border:1px solid var(--line);border-radius:8px;margin-bottom:26px}.outlet small{display:block;color:var(--muted);margin-top:4px}.group{font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:650;margin:22px 12px 8px}aside button{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:6px;color:#475467;margin:2px 0}aside button[aria-pressed=true]{background:#e5edff;color:#1d4ed8;font-weight:650}.top{height:64px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 32px;color:var(--muted);font-size:12px}.top strong{color:#344054}.main{min-width:0}.content{padding:30px 32px;max-width:1500px;margin:auto}.eyebrow{font-size:11px;font-weight:650;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:27px;letter-spacing:-.035em;margin:6px 0 8px;font-weight:650}h2{font-size:16px;margin:0 0 8px}h3{font-size:14px;margin:0 0 10px}p{line-height:1.6;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.primary,.secondary{border:1px solid var(--line);background:white;border-radius:7px;min-height:38px;padding:8px 14px;font-weight:550;color:#344054}.primary{background:var(--blue);color:white;border-color:var(--blue)}.toolbar{display:flex;gap:12px;align-items:center;padding:14px 0;margin-bottom:14px;border-top:1px solid var(--line);flex-wrap:wrap}.control{padding:10px 12px;border:1px solid #d0d5dd;border-radius:6px;color:#667085;background:white;min-width:150px}.search{min-width:260px}.push{margin-left:auto}.table{border:1px solid var(--line);border-radius:9px;overflow:auto;max-width:100%}table{border-collapse:collapse;min-width:650px;width:100%;font-size:13px}th{text-align:left;background:#f8fafc;color:#667085;font-size:11px;font-weight:600;padding:13px 16px;border-bottom:1px solid var(--line)}td{padding:16px;border-bottom:1px solid #eef0f3;vertical-align:middle}tbody tr:last-child td{border:0}.ref{font-weight:600;color:#1d4ed8}.sub{display:block;font-size:11px;color:var(--muted);margin-top:5px}.badge{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:#f8fafc;white-space:nowrap}.badge.blue{color:#1d4ed8;background:#eff6ff;border-color:#dbeafe}.badge.green{color:#166534;background:#f0fdf4;border-color:#dcfce7}.badge.amber{color:#92400e;background:#fffbeb;border-color:#fef3c7}.action{background:none;border:0;color:var(--blue);font-size:12px;font-weight:600;padding:8px}.num{text-align:right;font-variant-numeric:tabular-nums}.pagination{display:flex;justify-content:space-between;padding:14px 0;color:var(--muted);font-size:12px;align-items:center}.panel{border:1px solid var(--line);border-radius:9px;padding:20px;margin-top:20px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:18px 0;border-top:1px solid var(--line);margin-top:14px}.facts small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.facts strong{font-size:15px;font-variant-numeric:tabular-nums}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:22px 0}.tabs span{padding:10px 0;font-size:12px;color:var(--muted)}.tabs span:first-child{border-bottom:2px solid var(--blue);color:var(--blue);font-weight:600}.columns{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}.columns .panel,.compare .panel{margin-top:0}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{font-size:12px;color:#344054}.field div{margin-top:7px;min-height:40px;border:1px solid #d0d5dd;border-radius:6px;padding:10px;color:var(--muted)}.step{display:flex;gap:10px;align-items:center;margin-bottom:20px}.step b{width:25px;height:25px;border:1px solid #dbeafe;background:#eff6ff;border-radius:6px;display:grid;place-items:center;color:#1d4ed8;font-size:12px}.summaryline{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.note{border-left:3px solid var(--blue);padding:10px 14px;background:#f8fafc;font-size:12px;color:#475467;margin:18px 0}.empty{text-align:center;padding:64px 20px}.empty .symbol{margin:0 auto 18px;width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:#f8fafc;font-size:24px;color:#667085}.empty p{max-width:350px;margin:8px auto 20px}.setting{display:grid;grid-template-columns:1fr 1.3fr auto;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}.alternatives{display:flex;gap:8px;flex-wrap:wrap;font-size:11px}.alternatives span{border:1px solid var(--line);padding:5px 8px;border-radius:5px}.alternatives .chosen{border-color:#93b4fc;background:#eff6ff;color:#1d4ed8}@media(max-width:900px){.layout{grid-template-columns:190px minmax(0,1fr)}.content{padding:24px 20px}.columns{grid-template-columns:1fr}.compare{grid-template-columns:1fr}}@media(max-width:650px){.layout{display:block}aside{padding:12px;display:flex;gap:6px;overflow:auto;align-items:center}aside .brand,aside .outlet,aside .group{display:none}aside button{width:auto;white-space:nowrap}.top{padding:0 18px;height:52px}.content{padding:22px 16px}.heading{align-items:flex-start}.heading .primary{white-space:nowrap}.fieldgrid,.facts{grid-template-columns:1fr}.setting{grid-template-columns:1fr auto}.setting>span{grid-column:1/-1}.review{padding:12px 16px;display:block}.alternatives{margin-top:8px}.search{min-width:100%;width:100%}.tabs{overflow:auto;white-space:nowrap}.toolbar .push{margin-left:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header class="review"><div><strong>ShipIT · Proposed workbench</strong><p>Review wireframes · fictional sample data · no live actions</p></div><div class="alternatives"><span>A · Stacked cards</span><span class="chosen">B · Workbench — selected</span><span>C · Permanent three columns</span></div></header><div class="layout"><aside><div class="brand">ShipIT<span style="color:#2563eb">.</span></div><div class="outlet">Main counter<small>Owner · Organization Alpha</small></div><div class="group">OPERATIONS</div><button data-page="worklist">Packages</button><button data-page="booking">New booking</button><div class="group">FINANCE</div><button data-page="finance">Financial approvals</button><button data-page="matching">Reconciliation</button><button data-page="report">Reports</button><div class="group">WORKSPACE</div><button data-page="settings">Settings</button><button data-page="empty">Empty state</button></aside><div class="main"><div class="top"><span>Workspace <span style="margin:0 10px">/</span> <strong id="crumb">Packages</strong></span><span>Franchise Alpha-1 ▾</span></div><main id="content" class="content"></main></div></div><script>
const heading=(group,title,description,action='')=>`<div class="heading"><div><div class="eyebrow">${group}</div><h1>${title}</h1><p class="muted">${description}</p></div>${action?`<button class="primary">${action}</button>`:''}</div>`;
const toolbar=(search=true)=>`<div class="toolbar">${search?'<div class="control search">⌕　Find by docket</div>':''}<div class="control">All states　⌄</div><div class="control">Date range　⌄</div><button class="secondary push">↻　Refresh</button></div>`;
const table=(headers,rows)=>`<div class="table"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const fields=labels=>`<div class="fieldgrid">${labels.map(l=>`<div class="field">${l}<div>${l.includes('name')?'Enter name':l.includes('Service')?'Standard　⌄':'Enter value'}</div></div>`).join('')}</div>`;
const rows=[['<span class="ref">SIT-00001248</span><span class="sub">Confirmed 29 Oct, 10:42</span>','<span class="badge blue">In transit</span>','1,250 g','29 Oct, 10:42','<button class="action">Open package →</button>'],['<span class="ref">SIT-00001247</span><span class="sub">Confirmed 29 Oct, 10:36</span>','<span class="badge">Checked in</span>','800 g','29 Oct, 10:36','<button class="action">Open package →</button>'],['<span class="ref">SIT-00001246</span><span class="sub">Confirmed 29 Oct, 10:28</span>','<span class="badge amber">Out for delivery</span>','2,000 g','29 Oct, 10:28','<button class="action">Open package →</button>']];
const pages={
worklist:()=>heading('Operations','Packages','Find a package and continue its next permitted step.','New booking')+toolbar()+table(['Package','Status','Weight','Confirmed','Actions'],rows)+'<div class="pagination"><span>3 packages loaded · sample current page</span><button class="secondary">Load more</button></div><section class="panel"><h2>SIT-00001248</h2><p class="muted">Selected package · facts, next actions and evidence stay together.</p><div class="facts"><div><small>Status</small><strong>In transit</strong></div><div><small>Weight</small><strong>1,250 g</strong></div><div><small>Confirmed</small><strong>29 Oct, 10:42</strong></div></div><div class="tabs"><span>Package details</span><span>Timeline</span><span>Delivery</span><span>Payments</span></div><p class="muted">Existing authorized detail and action forms. Full references remain available.</p></section>',
booking:()=>heading('Counter','New booking','Customer, packages and tax details — then review the server price.')+'<div class="columns"><div><section class="panel"><div class="step"><b>1</b><h2>Customer / sender</h2></div>'+fields(['Customer name','Customer phone','Customer address','Billing account'])+'</section><section class="panel"><div class="step"><b>2</b><h2>Packages and service</h2></div>'+fields(['Recipient name','Recipient phone','Destination key','Service','Weight (grams)','Declared value'])+'<button class="secondary" style="margin-top:18px">+ Add package</button></section><section class="panel"><div class="step"><b>3</b><h2>Tax facts</h2></div>'+fields(['Service recipient reference','Handover state'])+'</section></div><section class="panel" style="align-self:start"><div class="step"><b>4</b><h2>Review and confirm</h2></div><div class="summaryline"><span>Packages</span><strong>1</strong></div><div class="summaryline"><span>Server price</span><strong>Not requested</strong></div><div class="summaryline"><span>Payment choice</span><strong>To Pay</strong></div><div class="note">A quote is required before confirmation. Changes invalidate the old price.</div><button class="primary" style="width:100%">Get server price and tax</button><p class="muted" style="margin-top:16px">An uncertain save retains the same request for reconciliation.</p></section></div>',
finance:()=>heading('Money','Financial approvals','Review the proposal and its source before an independent decision.')+'<div class="tabs"><span>Requests</span><span>Audit</span><span>Policy</span></div>'+table(['Request','Kind','Recorded','Proposed','State','Actions'],[['<span class="ref">Request …d218</span>','Charge correction','₹1,240.00','₹1,140.00','<span class="badge amber">Pending review</span>','<button class="action">Review →</button>']])+'<section class="panel"><h2>Review charge correction</h2><p class="muted">The requester cannot approve this proposal.</p><div class="facts"><div><small>Recorded</small><strong>₹1,240.00</strong></div><div><small>Proposed</small><strong>₹1,140.00</strong></div><div><small>Difference</small><strong>−₹100.00</strong></div></div>'+fields(['Decision reason'])+'<div class="note">Approval and actual money returned remain separate steps.</div><button class="primary">Record decision</button> <button class="secondary">View source evidence</button></section>',
matching:()=>heading('Money','Reconciliation','Compare imported evidence with recorded sources before matching.')+'<div class="tabs"><span>Imports</span><span>Matching</span><span>Review</span></div><div class="note">Suggestions are unconfirmed. Only an explicit reviewed match changes the relationship.</div><div class="compare"><section class="panel"><h2>Statement evidence</h2>'+table(['Date','Reference','Amount'],[['29 Oct','SYN-2026-014','₹2,000.00'],['29 Oct','SYN-2026-015','₹1,240.00']])+'</section><section class="panel"><h2>Recorded sources</h2>'+table(['Source','State','Amount'],[['Receipt …a318','Unmatched','₹2,000.00'],['Receipt …a317','Unmatched','₹1,240.00']])+'</section></div><section class="panel"><h2>Selected relationship</h2><div class="summaryline"><span>Variance</span><strong>₹0.00</strong></div><button class="primary" style="margin-top:16px">Confirm reviewed match</button></section>',
report:()=>heading('Insights','Sales report','Capture a report for an explicit franchise and period.','Capture report')+'<div class="tabs"><span>Sales / GST</span><span>To-Pay ageing</span><span>Delivery</span><span>Messaging</span><span>Costs</span><span>Owner summaries</span></div>'+toolbar(false)+'<div class="note">Captured 29 Oct, 11:00 · Franchise Alpha-1 · sample captured evidence, not a live balance</div><div class="facts"><div><small>Booked value</small><strong>₹12,480.00</strong></div><div><small>GST</small><strong>₹624.00</strong></div><div><small>Booking count</small><strong>24</strong></div></div>'+table(['Booking','Confirmed','Tax basis','Tax','Booked value'],[['SIT-00001248','29 Oct, 10:42','₹1,000.00','₹50.00','₹1,050.00'],['SIT-00001247','29 Oct, 10:36','₹600.00','₹30.00','₹630.00']])+'<div class="pagination"><span>2 sample evidence rows</span><button class="secondary">Download captured CSV</button></div>',
settings:()=>heading('Workspace','Settings','Manage defaults, franchise overrides and their source.')+'<div class="tabs"><span>Identity</span><span>Operations</span><span>Money</span><span>Accounts</span><span>Reporting</span></div><section class="panel"><h2>Identity and preferences</h2><p class="muted">Franchise Alpha-1 · saved configuration and source</p><div class="setting"><strong>Display name</strong><span>Main counter <span class="sub">Franchise override · revision 4</span></span><button class="secondary">Configure</button></div><div class="setting"><strong>Timezone</strong><span>Asia/Kolkata <span class="sub">Organization default</span></span><button class="secondary">Configure</button></div><div class="setting"><strong>Receipt identity</strong><span>Configured <span class="sub">Legal issuer remains distinct from the display preference</span></span><button class="secondary">View details</button></div></section>',
empty:()=>heading('Operations','Routes','Plan a manifest, then record its actual movement.','Create planning route')+toolbar(false)+'<div class="table"><table><thead><tr><th>Route</th><th>Origin → destination</th><th>State</th><th>Manifest</th><th>Actions</th></tr></thead></table><section class="empty"><div class="symbol">↗</div><h2>No routes match this view</h2><p class="muted">Change the state filter, or create a planning route when you are ready to group packages.</p><button class="secondary">Clear filters</button></section></div>'
};function show(id){document.querySelector('#content').innerHTML=pages[id]();document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===id)));document.querySelector('#crumb').textContent=document.querySelector(`[data-page="${id}"]`).textContent;history.replaceState(null,'','#'+id)}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.page)));show(pages[location.hash.slice(1)]?location.hash.slice(1):'worklist');
</script></body></html>
