name: Engineering checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Quality (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [planning, lint, types, tests, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Read the PR base / previous main commit for immutable migrations.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false # Reads packageManager from package.json.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Verify exact toolchain
        run: pnpm check:toolchain
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate workflow and gate behavior
        if: matrix.check == 'planning'
        run: pnpm test:quality
      - name: Validate planning and domain contracts
        if: matrix.check == 'planning'
        run: pnpm check:planning
      - name: Reject changes to released migrations
        if: matrix.check == 'planning'
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check:migrations
      - name: Lint maintained source and tooling
        if: matrix.check == 'lint'
        run: pnpm lint
      - name: Typecheck all packages
        if: matrix.check == 'types'
        run: pnpm typecheck
      - name: Test harness and prototype
        if: matrix.check == 'tests'
        run: pnpm test
      - name: Production bundle
        if: matrix.check == 'build'
        run: pnpm build
  database:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Verify exact toolchain
        run: pnpm check:toolchain
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      # The helper starts and removes the pinned container with generated
      # credentials, including on failure or cancellation, and exposes loopback only.
      - name: Run required PostgreSQL integration tests
        run: pnpm db:local test:db
  validate:
    # Preserve the existing branch-required check name during rollout.
    name: Planning and prototype checks
    needs: [checks, database]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every matrix job and PostgreSQL integration to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        # Inline so checkout/install failures cannot skip the final gate.
        # quality.test.mjs executes this exact body against negative cases.
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.QUALITY_RESULTS || '{}');
          if (Object.keys(results).length !== 2 || results.checks?.result !== 'success' || results.database?.result !== 'success') {
            console.error('Required checks failed, were cancelled, skipped, or are missing.');
            process.exit(1);
          }
          console.log('All required quality checks passed.');
          JS
