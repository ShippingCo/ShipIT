name: Engineering checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Quality (${{ matrix.check }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [planning, lint, types, tests, build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false # Reads packageManager from package.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Verify exact toolchain
        run: pnpm check:toolchain
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate workflow and gate behavior
        if: matrix.check == 'planning'
        run: pnpm test:quality
      - name: Validate planning and domain contracts
        if: matrix.check == 'planning'
        run: pnpm check:planning
      - name: Lint maintained source and tooling
        if: matrix.check == 'lint'
        run: pnpm lint
      - name: Typecheck all packages
        if: matrix.check == 'types'
        run: pnpm typecheck
      - name: Test prototype
        if: matrix.check == 'tests'
        run: pnpm test
      - name: Production bundle
        if: matrix.check == 'build'
        run: pnpm build
  validate:
    # Preserve the existing branch-required check name during rollout.
    name: Planning and prototype checks
    needs: [checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        # Inline so checkout/install failures cannot skip the final gate.
        # quality.test.mjs executes this exact body against negative cases.
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.QUALITY_RESULTS || '{}');
          if (Object.keys(results).length !== 1 || results.checks?.result !== 'success') {
            console.error('Required checks failed, were cancelled, skipped, or are missing.');
            process.exit(1);
          }
          console.log('All required quality checks passed.');
          JS
